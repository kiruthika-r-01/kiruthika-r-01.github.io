media:
  - name: images
    label: Site images
    input: public/images
    output: /images
  - name: tool-logos
    label: Tool logos
    input: public/images/tools
    output: /images/tools

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: greeting
        label: Greeting (orange, above the headline)
        type: string
        required: true
      - name: headline
        label: Headline
        type: string
        required: true
      - name: headlineItalic
        label: Last words of the headline to set in italic (must match the end of the headline exactly)
        type: string
      - name: intro
        label: Introduction paragraph
        type: text
        required: true
      - name: worksLabel
        label: Portfolio link label
        type: string
      - name: worksUrl
        label: Portfolio link address
        type: string
      - name: resumeLabel
        label: Résumé link label
        type: string
      - name: testimonialsHeading
        label: Testimonials heading (roman part)
        type: string
      - name: testimonialsHeadingItalic
        label: Testimonials heading (italic part)
        type: string
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role and company
            type: string
          - name: portrait
            label: Portrait (square image)
            type: image
            options:
              input: public/images
              output: /images
          - name: quote
            label: Quote
            type: text
            required: true
          - name: highlight
            label: Phrase to highlight in orange (copied exactly from the quote)
            type: string
      - name: testimonialsNote
        label: Note under the testimonial
        type: string
      - name: testimonialsLink
        label: Link under the note (opens an email)
        type: string
      - name: footerQuote
        label: Closing quote (homepage)
        type: text
      - name: footerQuoteAttribution
        label: Closing quote author
        type: string
  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: sections
        label: Chapters (in order)
        type: object
        list: true
        fields:
          - name: id
            label: Chapter number (e.g. 00)
            type: string
            required: true
          - name: tagline
            label: Tagline (orange italic, e.g. Restless)
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: link
        label: Linked phrase (one phrase in the text that becomes a link)
        type: object
        fields:
          - name: text
            label: Phrase (copied exactly from a paragraph)
            type: string
          - name: url
            label: Link address
            type: string
      - name: closingLabel
        label: Closing link to Career
        type: string
  - name: career
    label: Career page
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experiences
        label: Career experiences (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{company}"
        fields:
          - name: company
            label: Company or organisation
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: ongoing
            label: Ongoing practice that overlaps other roles
            type: boolean
          - name: highlights
            label: Achievements
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Achievement {index}"
            fields:
              - name: text
                label: Achievement text
                type: text
                required: true
              - name: emphasis
                label: Orange emphasis phrases
                type: string
                list: true
              - name: italic
                label: Italic phrase, if applicable
                type: string
      - name: tools
        label: Tools (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Tool name
            type: string
            required: true
          - name: mark
            label: Short text mark when no suitable image is available
            type: string
          - name: logo
            label: Logo
            type: image
            options:
              media: tool-logos
      - name: competencies
        label: Competencies (display order)
        type: string
        list: true
  - name: now
    label: Now (About page)
    type: file
    path: src/data/now.json
    format: json
    fields:
      - name: updated
        label: Month this was last true (e.g. November 2026)
        type: string
        required: true
      - name: text
        label: What you're doing now
        type: text
        required: true
  - name: writings
    label: Writings
    type: collection
    path: src/content/writings
    format: yaml-frontmatter
    filename: '{fields.title}.md'
    view:
      fields: [title, section, topic, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: dek
        label: One-line summary (optional; shown under the title in lists, and used by search engines)
        type: string
      - name: date
        label: Published on
        type: date
        required: true
      - name: updated
        label: Last updated (optional)
        type: date
      - name: section
        label: Section
        type: select
        required: true
        options:
          values: [personal, work]
      - name: topic
        label: Topic (pick one from the chosen section)
        type: select
        required: true
        options:
          values: [Life, Observations, Books, Films and series, SEO and AEO, Content, GTM, Product marketing, AI and tools, Experiments, Career]
      - name: seoTitle
        label: Search title (optional; the full title shown on Google, about 60 characters)
        type: string
      - name: seoDescription
        label: Search description (optional; about 155 characters)
        type: text
      - name: draft
        label: Draft (hidden from the site while on)
        type: boolean
        default: false
      - name: cover
        label: Cover image (optional; shown beside the title)
        type: image
        options:
          input: public/images/writings/covers
          output: /images/writings/covers
      - name: coverAlt
        label: Cover description for screen readers (what the image shows)
        type: string
      - name: coverWidth
        label: Cover width in pixels (so it is never shown larger than it is)
        type: number
      - name: og
        label: Share image, 1200 x 630 (optional; shown when the piece is shared)
        type: image
        options:
          input: public/og
          output: /og
      - name: body
        label: Text
        type: rich-text
