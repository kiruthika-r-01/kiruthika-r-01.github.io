media:
  - name: images
    label: Site images
    input: public/images
    output: /images
  - name: tool-logos
    label: Tool logos
    input: public/images/tools
    output: /images/tools
  - name: writing-covers
    label: Writing covers
    input: public/images/writings/covers
    output: /images/writings/covers
    categories: [image]
  - name: work-images
    label: Selected works images
    input: public/images/work
    output: /images/work
    categories: [image]
  - name: shelf-images
    label: Shelf covers and posters
    input: public/images/shelf
    output: /images/shelf
    categories: [image]
  - name: share-images
    label: Share images (1200 x 630)
    input: public/og
    output: /og
    categories: [image]

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: greeting
        label: Greeting (orange, above the headline)
        type: string
        required: true
      - name: headline
        label: Headline
        type: string
        required: true
      - name: headlineItalic
        label: Last words of the headline to set in italic (must match the end of the headline exactly)
        type: string
      - name: intro
        label: Introduction paragraph
        type: text
        required: true
      - name: worksLabel
        label: Portfolio link label
        type: string
      - name: worksUrl
        label: Portfolio link address
        type: string
      - name: resumeLabel
        label: Résumé link label
        type: string
      - name: testimonialsHeading
        label: Testimonials heading (roman part)
        type: string
      - name: testimonialsHeadingItalic
        label: Testimonials heading (italic part)
        type: string
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role and company
            type: string
          - name: portrait
            label: Portrait (square image)
            type: image
            options:
              media: images
          - name: quote
            label: Quote
            type: text
            required: true
          - name: highlight
            label: Phrase to highlight in orange (copied exactly from the quote)
            type: string
      - name: testimonialsNote
        label: Note under the testimonial
        type: string
      - name: testimonialsLink
        label: Link under the note (opens an email)
        type: string
      - name: footerQuote
        label: Closing quote (homepage)
        type: text
      - name: footerQuoteAttribution
        label: Closing quote author
        type: string
  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: sections
        label: Chapters (in order)
        type: object
        list: true
        fields:
          - name: id
            label: Chapter number (e.g. 00)
            type: string
            required: true
          - name: tagline
            label: Tagline (orange italic, e.g. Restless)
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: link
        label: Linked phrase (one phrase in the text that becomes a link)
        type: object
        fields:
          - name: text
            label: Phrase (copied exactly from a paragraph)
            type: string
          - name: url
            label: Link address
            type: string
      - name: closingLabel
        label: Closing link to Career
        type: string
  - name: kafka
    label: Kafka (the crow's page)
    type: file
    path: src/data/kafka.json
    format: json
    fields:
      - { name: dek, label: Line under her name, type: string }
      - { name: stamp, label: Stamp (first line large), type: string, list: true }
      - name: file
        label: On file (one row per fact)
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: value, label: Value, type: string }
          - { name: note, label: Footnote (optional), type: text }
          - { name: withheld, label: Show as redacted, type: boolean }
          - { name: live, label: Show the live orange dot, type: boolean }
      - { name: whiskey, label: "Whiskey note (shown when her name is clicked in the file; each click shows the next line)", type: string, list: true }
      - { name: intro, label: Opening paragraph(s), type: text, list: true }
      - { name: official, label: The official account (paragraphs), type: text, list: true }
      - { name: actual, label: "The actual account (first two lines are set large)", type: text, list: true }
      - { name: editorsNote, label: "Editor's note", type: text }
      - { name: likes, label: In favour of, type: string, list: true }
      - { name: dislikes, label: Opposed to, type: string, list: true }
      - { name: interests, label: Interests, type: text }
      - name: lines
        label: What she says on the page
        type: object
        fields:
          - { name: arrive, label: When someone arrives, type: string }
          - { name: facts, label: "Facts she tells when you hover or tap her (in order, repeating; keep 5 to 10, all true)", type: string, list: true }
          - { name: theme, label: When the theme changes, type: string }
          - { name: linger, label: After a long stay, type: string }
      - name: perches
        label: What she says at each section (as she follows the reader down the page)
        type: object
        fields:
          - { name: file, label: On file, type: string }
          - { name: account, label: Before all this (the official account), type: string }
          - { name: turn, label: Just before the dustbin reveal, type: string }
          - { name: notes, label: Field notes, type: string }
      - name: quote
        label: Closing quote
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: by, label: By, type: string }
  - name: work
    label: Selected works
    type: file
    path: src/data/work.json
    format: json
    fields:
      - name: seo
        label: Search title and description (the folders page)
        type: object
        fields:
          - { name: title, label: Search title, type: string }
          - { name: description, label: Search description (about 150 characters), type: text }
      - { name: kicker, label: Small label above the title, type: string }
      - { name: title, label: Title (first part), type: string }
      - { name: titleItalic, label: Title (italic end), type: string }
      - { name: lede, label: Line under the title, type: text }
      - name: kafka
        label: Kafka by the heading (before you point at a folder)
        type: object
        fields:
          - { name: hint, label: "Hint she shows (mouse)", type: string }
          - { name: hintTouch, label: "Hint she shows (touch screens)", type: string }
          - { name: says, label: What she says when hovered or tapped, type: string }
      - name: quote
        label: Closing quote (all Selected Works pages)
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: by, label: By, type: string }
      - name: companies
        label: Companies (logo and one line, shown with their writing)
        type: object
        list: true
        fields:
          - { name: name, label: Name (must match the Company of each piece), type: string, required: true }
          - { name: logo, label: Logo, type: image, options: { media: work-images } }
          - { name: site, label: Website, type: string }
          - { name: about, label: One line on what the company does, type: string }
          - { name: reader, label: "Who the writing is for (e.g. CIOs and IT leaders)", type: string }
          - { name: profile, label: Your author page there (optional), type: string }
          - { name: profileLabel, label: Author page link text, type: string }
      - name: folders
        label: Folders (in order)
        type: object
        list: true
        fields:
          - { name: slug, label: "Web address (lowercase, dashes: becomes /work/<this>/)", type: string, required: true }
          - { name: name, label: Folder name, type: string, required: true }
          - { name: tab, label: What is inside (one short line), type: string }
          - { name: blurb, label: Description, type: text }
          - { name: peek, label: Image peeking out of the folder, type: image, options: { media: work-images } }
          - { name: kafka, label: "What Kafka says about this folder (when you hover or tap her)", type: string }
          - { name: sealed, label: Sealed (shows Under review until it has content), type: boolean }
          - { name: sealedNote, label: Note shown while sealed, type: text }
          - { name: seoTitle, label: Search title for this folder's page, type: string }
          - { name: seoDescription, label: Search description for this folder's page, type: text }
          - name: groups
            label: Sections inside the folder
            type: object
            list: true
            fields:
              - { name: title, label: Section title, type: string, required: true }
              - name: layout
                label: Layout
                type: select
                options:
                  values:
                    - { value: cards, label: "Projects (image, description, links)" }
                    - { value: tiles, label: "Glass cards (format, title, company)" }
                    - { value: matchups, label: "Comparison / alternative cards (X vs Y)" }
                    - { value: archive, label: "Full archive list, with company filters" }
              - { name: note, label: Small note beside the title, type: string }
              - { name: filter, label: "Show filters (by format, or by market for comparison cards)", type: boolean }
              - name: items
                label: Entries
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: url, label: Link, type: string }
                  - { name: company, label: Company, type: string }
                  - { name: kind, label: "Kind (e.g. Blog, Comparison, Alternatives, Playbook)", type: string }
                  - { name: format, label: "Format (glass cards: e.g. Thought leadership, Buyer's guide, How-to)", type: string }
                  - { name: product, label: "Comparison cards: your product (e.g. ComplyScore®)", type: string }
                  - { name: rival, label: "Comparison cards: the competitor", type: string }
                  - { name: market, label: "Comparison cards: market (e.g. Third-party risk)", type: string }
                  - { name: image, label: "Image (projects only; 1500 x 600 works best)", type: image, options: { media: work-images } }
                  - { name: description, label: "Description (projects only)", type: text }
                  - { name: label, label: "Link button text (projects only)", type: string }
                  - { name: url2, label: "Second link (optional)", type: string }
                  - { name: label2, label: "Second link button text", type: string }
  - name: shelf
    label: Shelf
    type: file
    path: src/data/shelf.json
    format: json
    fields:
      - name: seo
        label: Search title and description
        type: object
        fields:
          - { name: title, label: Search title, type: string }
          - { name: description, label: Search description, type: text }
      - { name: kicker, label: Small label above the title, type: string }
      - { name: title, label: Title (first part), type: string }
      - { name: titleItalic, label: Title (italic end), type: string }
      - { name: lede, label: Line under the title, type: text }
      - { name: letterboxd, label: Letterboxd username (recent films are read from it automatically), type: string }
      - name: currently
        label: Currently (the four cards at the top)
        type: object
        list: true
        fields:
          - { name: label, label: "Label (e.g. Watching, On repeat)", type: string }
          - { name: title, label: Title, type: string }
          - { name: by, label: "By / from (artist, author, channel)", type: string }
          - { name: note, label: Your one line, type: text }
          - { name: image, label: Cover, type: image, options: { media: shelf-images } }
          - { name: url, label: Link (optional), type: string }
          - { name: spotify, label: "Spotify link (if it's a song; plays on the page)", type: string }
          - { name: fromLetterboxd, label: "Fill from Letterboxd automatically (last watched)", type: boolean }
      - name: shelves
        label: Favourite four (one shelf per type)
        type: object
        list: true
        fields:
          - { name: id, label: "Id (films, series, books, music, podcasts, youtube)", type: string }
          - { name: name, label: Name on the switch, type: string }
          - name: items
            label: Your four
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: by, label: "By (director, author, artist, host)", type: string }
              - { name: year, label: Year, type: string }
              - { name: image, label: "Cover or poster (2:3)", type: image, options: { media: shelf-images } }
              - { name: url, label: Link, type: string }
              - { name: spotify, label: "Spotify link (songs only; plays on the page)", type: string }
              - { name: note, label: Your one line, type: text }
          - name: more
            label: More (shown only in the room, as spines, tapes and records)
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: by, label: "By (director, author, artist)", type: string }
              - { name: year, label: Year, type: string }
              - { name: image, label: "Cover or poster", type: image, options: { media: shelf-images } }
              - { name: url, label: Link, type: string }
              - { name: spotify, label: "Spotify link (songs only; plays on the page)", type: string }
              - { name: note, label: Your one line, type: text }
      - { name: missingNote, label: Text for an empty slot on the shelf, type: string }
      - name: bookmarks
        label: Bookmarks (people and brands you learn from)
        type: object
        list: true
        fields:
          - { name: group, label: Group name, type: string }
          - { name: note, label: Line under the group (optional), type: string }
          - name: people
            label: Entries
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: knownFor, label: Known for (a few words), type: string }
              - { name: note, label: What you took from them (one line), type: text }
              - { name: url, label: Link, type: string }
              - { name: image, label: "Photo or logo (square; shown black and white, colour on hover)", type: image, options: { media: shelf-images } }
      - name: desk
        label: On the desk
        type: object
        fields:
          - { name: kafka, label: What Kafka says on the monitor, type: string }
          - { name: kafkaWindow, label: What Kafka says at the window by day (when the blind is up), type: string }
          - { name: kafkaWindowNight, label: What Kafka says at the window at night, type: string }
          - { name: kafkaCorner, label: What Kafka says about her corner (the perch on the left wall), type: string }
          - { name: shelfLine, label: Line when you point at the bookcase itself, type: string }
          - { name: shelfNote, label: Second line on the bookcase card, type: string }
          - name: trex
            label: The T-rex on the shelf
            type: object
            fields:
              - { name: kind, label: Small label, type: string }
              - { name: name, label: Name, type: string }
              - { name: note, label: Its line, type: text }
          - name: items
            label: Things on the desk and shelf
            type: object
            list: true
            fields:
              - { name: id, label: "Object in the room (monitor, laptop, phone, stand, keyboard, mouse, earphones, can, pens, press, mug, frame)", type: string }
              - { name: kind, label: "Label (e.g. Monitor)", type: string }
              - { name: name, label: Product name, type: string }
              - { name: note, label: Your one line, type: text }
          - { name: monitorApps, label: Apps on the monitor (work), type: string, list: true }
          - { name: laptopApps, label: Apps on the laptop (after hours), type: string, list: true }
      - name: quote
        label: Closing quote (leave empty for the default)
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: by, label: By, type: string }
  - name: career
    label: Career page
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experiences
        label: Career experiences (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{company}"
        fields:
          - name: company
            label: Company or organisation
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: ongoing
            label: Ongoing practice that overlaps other roles
            type: boolean
          - name: highlights
            label: Achievements
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Achievement {index}"
            fields:
              - name: text
                label: Achievement text
                type: text
                required: true
              - name: emphasis
                label: Orange emphasis phrases
                type: string
                list: true
              - name: italic
                label: Italic phrase, if applicable
                type: string
      - name: tools
        label: Tools (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Tool name
            type: string
            required: true
          - name: mark
            label: Short text mark when no suitable image is available
            type: string
          - name: logo
            label: Logo
            type: image
            options:
              media: tool-logos
      - name: competencies
        label: Competencies (display order)
        type: string
        list: true
  - name: now
    label: Now (About page)
    type: file
    path: src/data/now.json
    format: json
    fields:
      - name: updated
        label: Month this was last true (e.g. November 2026)
        type: string
        required: true
      - name: text
        label: What you're doing now
        type: text
        required: true
  - name: writings
    label: Writings
    type: collection
    path: src/content/writings
    format: yaml-frontmatter
    filename: '{fields.title}.md'
    view:
      fields: [title, section, topic, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: dek
        label: One-line summary (optional; shown under the title in lists, and used by search engines)
        type: string
      - name: date
        label: Published on
        type: date
        required: true
      - name: updated
        label: Last updated (optional)
        type: date
      - name: section
        label: Section
        type: select
        required: true
        options:
          values: [personal, work]
      - name: topic
        label: Topic (pick one from the chosen section)
        type: select
        required: true
        options:
          values: [Life, Observations, Books, Films and series, SEO and AEO, Content, GTM, Product marketing, AI and tools, Experiments, Career]
      - name: seoTitle
        label: Search title (optional; the full title shown on Google, about 60 characters)
        type: string
      - name: seoDescription
        label: Search description (optional; about 155 characters)
        type: text
      - name: draft
        label: Draft (hidden from the site while on)
        type: boolean
        default: false
      - name: cover
        label: Cover image (optional; shown beside the title; at least 760px wide)
        type: image
        options:
          media: writing-covers
      - name: coverAlt
        label: Cover description for screen readers (what the image shows)
        type: string
      - name: coverWidth
        label: Cover width in pixels (optional; leave empty to use the image's own width)
        type: number
      - name: og
        label: Share image, 1200 x 630 (optional; shown when the piece is shared on LinkedIn, WhatsApp, X)
        type: image
        options:
          media: share-images
      - name: body
        label: Text
        type: rich-text
