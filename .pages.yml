media:
  - name: images
    label: Site images
    input: public/images
    output: /images
  - name: tool-logos
    label: Tool logos
    input: public/images/tools
    output: /images/tools

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: eyebrow
        label: Intro label
        type: string
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Introduction paragraph
        type: text
      - name: personalNote
        label: Personal note
        type: text
      - name: worksLabel
        label: Portfolio link label
        type: string
      - name: contactLabel
        label: Contact link label
        type: string
      - name: essayTitle
        label: Essay title
        type: string
      - name: essay
        label: Essay body (separate paragraphs with a blank line)
        type: text
      - name: siteSectionTitle
        label: Site section heading
        type: string
      - name: siteSectionCopy
        label: Site section paragraph
        type: text
      - name: footerQuote
        label: Footer quote
        type: text
      - name: footerQuoteAttribution
        label: Quote attribution
        type: string
  - name: career
    label: Career page
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experiences
        label: Career experiences (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{company}"
        fields:
          - name: company
            label: Company or organisation
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: ongoing
            label: Ongoing practice that overlaps other roles
            type: boolean
          - name: highlights
            label: Achievements
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Achievement {index}"
            fields:
              - name: text
                label: Achievement text
                type: text
                required: true
              - name: emphasis
                label: Orange emphasis phrases
                type: string
                list: true
              - name: italic
                label: Italic phrase, if applicable
                type: string
      - name: tools
        label: Tools (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Tool name
            type: string
            required: true
          - name: mark
            label: Short text mark when no suitable image is available
            type: string
          - name: logo
            label: Logo
            type: image
            options:
              media: tool-logos
      - name: competencies
        label: Competencies (display order)
        type: string
        list: true
  - name: now
    label: Now (About page)
    type: file
    path: src/data/now.json
    format: json
    fields:
      - name: updated
        label: Month this was last true (e.g. November 2026)
        type: string
        required: true
      - name: text
        label: What you're doing now
        type: text
        required: true
  - name: writings
    label: Writings
    type: collection
    path: src/content/writings
    format: yaml-frontmatter
    filename: '{fields.title}.md'
    view:
      fields: [title, section, topic, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: dek
        label: One-line summary (optional; shown under the title in lists, and used by search engines)
        type: string
      - name: date
        label: Published on
        type: date
        required: true
      - name: updated
        label: Last updated (optional)
        type: date
      - name: section
        label: Section
        type: select
        required: true
        options:
          values: [personal, work]
      - name: topic
        label: Topic (pick one from the chosen section)
        type: select
        required: true
        options:
          values: [Life, Observations, Books, Films and series, SEO and AEO, Content, GTM, Product marketing, AI and tools, Experiments, Career]
      - name: seoTitle
        label: Search title (optional; the full title shown on Google, about 60 characters)
        type: string
      - name: seoDescription
        label: Search description (optional; about 155 characters)
        type: text
      - name: draft
        label: Draft (hidden from the site while on)
        type: boolean
        default: false
      - name: cover
        label: Cover image (optional; shown beside the title)
        type: image
        options:
          input: public/images/writings/covers
          output: /images/writings/covers
      - name: coverAlt
        label: Cover description for screen readers (what the image shows)
        type: string
      - name: coverWidth
        label: Cover width in pixels (so it is never shown larger than it is)
        type: number
      - name: og
        label: Share image, 1200 x 630 (optional; shown when the piece is shared)
        type: image
        options:
          input: public/og
          output: /og
      - name: body
        label: Text
        type: rich-text
