media:
  - name: images
    label: Site images
    input: public/images
    output: /images
  - name: tool-logos
    label: Tool logos
    input: public/images/tools
    output: /images/tools

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: eyebrow
        label: Intro label
        type: string
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Introduction paragraph
        type: text
      - name: personalNote
        label: Personal note
        type: text
      - name: worksLabel
        label: Portfolio link label
        type: string
      - name: contactLabel
        label: Contact link label
        type: string
      - name: essayTitle
        label: Essay title
        type: string
      - name: essay
        label: Essay body (separate paragraphs with a blank line)
        type: text
      - name: siteSectionTitle
        label: Site section heading
        type: string
      - name: siteSectionCopy
        label: Site section paragraph
        type: text
      - name: footerQuote
        label: Footer quote
        type: text
      - name: footerQuoteAttribution
        label: Quote attribution
        type: string
  - name: career
    label: Career page
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experiences
        label: Career experiences (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{company}"
        fields:
          - name: company
            label: Company or organisation
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: ongoing
            label: Ongoing practice that overlaps other roles
            type: boolean
          - name: highlights
            label: Achievements
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Achievement {index}"
            fields:
              - name: text
                label: Achievement text
                type: text
                required: true
              - name: emphasis
                label: Orange emphasis phrases
                type: string
                list: true
              - name: italic
                label: Italic phrase, if applicable
                type: string
      - name: tools
        label: Tools (display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Tool name
            type: string
            required: true
          - name: mark
            label: Short text mark when no suitable image is available
            type: string
          - name: logo
            label: Logo
            type: image
            options:
              media: tool-logos
      - name: competencies
        label: Competencies (display order)
        type: string
        list: true
